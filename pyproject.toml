[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-quality-validation-framework"
version = "0.2.0"
description = "Rule-driven data quality validation: schema, null, duplicate, range, allowed-value, referential, and freshness checks, with quarantine and pass/fail reporting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]
license = { text = "MIT" }

[project.urls]
Homepage = "https://github.com/harishsingi/data-quality-validation-framework"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dq-validate = "src.dq.cli:main_validate"
dq-generate = "src.dq.cli:main_generate"

[tool.setuptools]
packages = ["src", "src.dq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
